<!DOCTYPE html>
<html lang="sk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Arcade Games Vault</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Motiva Sans', Arial, sans-serif;
        }

        body {
            background-color: #1b2838;
            color: #c6d4df;
            padding: 20px;
        }

        .steam-container {
            max-width: 900px;
            margin: 0 auto;
            background: linear-gradient(135deg, #171a21 0%, #1b2838 100%);
            border-radius: 6px;
            padding: 25px;
            box-shadow: 0 0 20px rgba(0,0,0,0.8);
        }

        header {
            border-bottom: 2px solid #2a475e;
            padding-bottom: 15px;
            margin-bottom: 25px;
        }

        .logo {
            font-size: 28px;
            font-weight: bold;
            background: linear-gradient(90deg, #66c0f4, #c6d4df);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .games-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .game-card {
            background: #16202d;
            border: 1px solid #2a475e;
            border-radius: 4px;
            padding: 15px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .game-title {
            color: #ffffff;
            font-size: 18px;
            font-weight: bold;
            margin-bottom: 8px;
        }

        .btn-play {
            background: linear-gradient(90deg, #47bfff 0%, #1a44c2 100%);
            color: #ffffff;
            border: none;
            padding: 10px;
            border-radius: 3px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 15px;
            text-align: center;
        }

        .btn-play:hover {
            filter: brightness(1.2);
        }

        /* Herné okno */
        #game-screen {
            display: none;
            background: #000000;
            border: 2px solid #66c0f4;
            border-radius: 6px;
            padding: 20px;
            text-align: center;
            margin-top: 20px;
        }

        canvas {
            background: #111;
            border: 1px solid #333;
            margin: 10px auto;
            display: block;
        }

        .back-btn {
            background: #ce4a4a;
            color: #fff;
            border: none;
            padding: 8px 16px;
            border-radius: 3px;
            cursor: pointer;
            margin-bottom: 15px;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <div class="steam-container">
        <header>
            <div class="logo">Arcade Games Vault</div>
            <p>Vyber si hru a hraj priamo na webe!</p>
        </header>

        <!-- Zoznam hier -->
        <div id="catalog" class="games-grid">
            <div class="game-card">
                <div>
                    <div class="game-title">Snake (Hadík)</div>
                    <p>Klasický retro Hadík. Zbieraj červené jablká a zväčšuj svoju dĺžku. Ovládanie: Šípky.</p>
                </div>
                <button class="btn-play" onclick="startSnake()">Hrať Hadíka</button>
            </div>

            <div class="game-card">
                <div>
                    <div class="game-title">Clicker Hra</div>
                    <p>Rýchla klikacia hra. Získaj čo najviac bodov za 10 sekúnd!</p>
                </div>
                <button class="btn-play" onclick="startClicker()">Hrať Clicker</button>
            </div>
        </div>

        <!-- Herná plocha -->
        <div id="game-screen">
            <button class="back-btn" onclick="closeGame()">← Späť na výber hier</button>
            <h2 id="game-title-display" style="color:#fff; margin-bottom:10px;"></h2>
            
            <!-- Konajner pre Snake -->
            <div id="snake-container" style="display:none;">
                <canvas id="snakeCanvas" width="300" height="300"></canvas>
                <p>Skóre: <span id="snake-score">0</span></p>
            </div>

            <!-- Kontajner pre Clicker -->
            <div id="clicker-container" style="display:none;">
                <p style="font-size: 24px; margin: 15px;">Čas: <span id="clicker-time">10</span>s | Skóre: <span id="clicker-score">0</span></p>
                <button id="clicker-btn" class="btn-play" style="font-size: 20px; padding: 20px 40px;" onclick="addClick()">KLIKAJ!</button>
            </div>
        </div>
    </div>

    <script>
        const catalog = document.getElementById('catalog');
        const gameScreen = document.getElementById('game-screen');
        const gameTitleDisplay = document.getElementById('game-title-display');

        function closeGame() {
            gameScreen.style.display = 'none';
            catalog.style.display = 'grid';
            clearInterval(snakeInterval);
            clearInterval(clickerInterval);
        }

        /* --- S N A K E   H R A --- */
        let snakeInterval;
        function startSnake() {
            catalog.style.display = 'none';
            gameScreen.style.display = 'block';
            document.getElementById('snake-container').style.display = 'block';
            document.getElementById('clicker-container').style.display = 'none';
            gameTitleDisplay.textContent = "Hadík";

            const canvas = document.getElementById("snakeCanvas");
            const ctx = canvas.getContext("2d");
            let score = 0;
            document.getElementById('snake-score').textContent = score;

            let snake = [{x: 150, y: 150}];
            let dx = 10, dy = 0;
            let food = {x: 100, y: 100};

            document.onkeydown = function(e) {
                if (e.key === "ArrowUp" && dy === 0) { dx = 0; dy = -10; }
                if (e.key === "ArrowDown" && dy === 0) { dx = 0; dy = 10; }
                if (e.key === "ArrowLeft" && dx === 0) { dx = -10; dy = 0; }
                if (e.key === "ArrowRight" && dx === 0) { dx = 10; dy = 0; }
            };

            clearInterval(snakeInterval);
            snakeInterval = setInterval(() => {
                let head = {x: snake[0].x + dx, y: snake[0].y + dy};

                // Náraz do steny
                if (head.x < 0 || head.x >= 300 || head.y < 0 || head.y >= 300) {
                    alert("Koniec hry! Skóre: " + score);
                    startSnake();
                    return;
                }

                snake.unshift(head);

                // Zjedenie potravy
                if (head.x === food.x && head.y === food.y) {
                    score += 10;
                    document.getElementById('snake-score').textContent = score;
                    food = {
                        x: Math.floor(Math.random() * 30) * 10,
                        y: Math.floor(Math.random() * 30) * 10
                    };
                } else {
                    snake.pop();
                }

                // Vykreslenie
                ctx.fillStyle = "black";
                ctx.fillRect(0, 0, 300, 300);

                ctx.fillStyle = "red";
                ctx.fillRect(food.x, food.y, 10, 10);

                ctx.fillStyle = "#66c0f4";
                snake.forEach(part => ctx.fillRect(part.x, part.y, 10, 10));
            }, 100);
        }

        /* --- C L I C K E R   H R A --- */
        let clickerScore = 0;
        let clickerTime = 10;
        let clickerInterval;
        let clickerActive = false;

        function startClicker() {
            catalog.style.display = 'none';
            gameScreen.style.display = 'block';
            document.getElementById('snake-container').style.display = 'none';
            document.getElementById('clicker-container').style.display = 'block';
            gameTitleDisplay.textContent = "Clicker Speed Test";

            clickerScore = 0;
            clickerTime = 10;
            clickerActive = true;
            document.getElementById('clicker-score').textContent = clickerScore;
            document.getElementById('clicker-time').textContent = clickerTime;
            document.getElementById('clicker-btn').disabled = false;

            clearInterval(clickerInterval);
            clickerInterval = setInterval(() => {
                clickerTime--;
                document.getElementById('clicker-time').textContent = clickerTime;
                if (clickerTime <= 0) {
                    clearInterval(clickerInterval);
                    clickerActive = false;
                    document.getElementById('clicker-btn').disabled = true;
                    alert("Čas vypršal! Tvoje skóre: " + clickerScore);
                }
            }, 1000);
        }

        function addClick() {
            if (clickerActive) {
                clickerScore++;
                document.getElementById('clicker-score').textContent = clickerScore;
            }
        }
    </script>
</body>
</html>
